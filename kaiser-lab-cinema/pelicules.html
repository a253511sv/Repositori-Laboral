<!DOCTYPE html>
<html lang="ca">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pel·lícules - Kaiser Lab Cinema</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
    
    <style>
        :root { --color-primary: #e6b800; }
        body { background: #0f0f0f; color: #f5f5f5; font-family: 'Segoe UI', sans-serif; }
        .navbar { background: #1a1a1a; border-bottom: 4px solid var(--color-primary); }
        .navbar-brand { color: var(--color-primary) !important; font-weight: 700; font-size: 1.6rem; }
        .card { background: #1f1f1f; border: none; transition: all 0.3s; }
        .card:hover { transform: scale(1.05); box-shadow: 0 10px 25px rgba(230,184,0,0.4); }
        .card-img-top { height: 320px; object-fit: cover; }
        .card-title { color: var(--color-primary); }
        .btn-detail { background: var(--color-primary); color: #000; font-weight: 700; }
        .btn-detail:hover { background: #ffcc00; }
    </style>
</head>
<body>
    <!-- NAVBAR AMB CERCA GLOBAL -->
    <nav class="navbar navbar-expand-lg navbar-dark fixed-top">
        <div class="container">
            <a class="navbar-brand" href="index.html">Kaiser Lab Cinema</a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="navbarNav">
                <ul class="navbar-nav me-auto">
                    <li class="nav-item"><a class="nav-link" href="index.html">Inici</a></li>
                    <li class="nav-item"><a class="nav-link active" href="pelicules.html">Pel·lícules</a></li>
                    <li class="nav-item"><a class="nav-link" href="perfil.html">Perfil</a></li>
                    <li class="nav-item"><a class="nav-link" href="admin.html">Admin</a></li>
                </ul>

                <!-- CERCA GLOBAL (sempre visible) -->
                <form class="d-flex ms-auto" action="pelicules.html" method="get">
                    <input type="search" name="q" id="globalSearch" 
                           class="form-control me-2" placeholder="Cerca pel·lícules..." 
                           style="width: 340px;">
                    <button class="btn btn-primary" type="submit">
                        <i class="bi bi-search"></i>
                    </button>
                </form>
            </div>
        </div>
    </nav>

    <div style="height: 80px;"></div>

    <div class="container my-5">
        <h2 class="text-light mb-4">Llistat de Pel·lícules</h2>

        <!-- FILTRES AVANÇATS -->
        <div class="row mb-4 align-items-end">
            <div class="col-lg-5">
                <div class="input-group">
                    <input type="text" id="searchInput" class="form-control form-control-lg" placeholder="Cerca per títol...">
                    <button onclick="filterMovies()" class="btn btn-primary">Cercar</button>
                </div>
            </div>
            <div class="col-lg-3">
                <select id="genreFilter" class="form-select">
                    <option value="Tots">Tots els gèneres</option>
                    <option value="Acció">Acció</option>
                    <option value="Drama">Drama</option>
                    <option value="Comèdia">Comèdia</option>
                    <option value="Ciència Ficció">Ciència Ficció</option>
                    <option value="Històric">Històric</option>
                    <option value="Musical">Musical</option>
                    <option value="Thriller">Thriller</option>
                    <option value="Misteri">Misteri</option>
                    <option value="Fantasia">Fantasia</option>
                </select>
            </div>
            <div class="col-lg-2">
                <button onclick="filterMovies()" class="btn btn-success w-100">Aplicar Filtres</button>
            </div>
            <div class="col-lg-2 text-end">
                <small class="text-muted" id="resultCount">Mostrant <span id="count">20</span> pel·lícules</small>
            </div>
        </div>

        <!-- GRID -->
        <div class="row row-cols-1 row-cols-md-2 row-cols-lg-4 g-4" id="movieGrid"></div>
    </div>

    <!-- FOOTER -->
    <footer class="bg-dark text-white text-center py-4">
        <div class="container">
            <p>© 2026 Kaiser Lab Cinema</p>
        </div>
    </footer>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script>
        const pelicules = [
            {id:1, img:"img/movie1.jpg", title:"Peaky Blinders: The Immortal Man", year:"2026", genre:"Drama"},
            {id:2, img:"img/movie2.jpg", title:"John Wick: Chapter 4", year:"2023", genre:"Acció"},
            {id:3, img:"img/movie3.jpg", title:"Gladiator", year:"2000", genre:"Acció"},
            {id:4, img:"img/movie4.jpg", title:"Tick, Tick... Boom!", year:"2021", genre:"Musical"},
            {id:5, img:"img/movie5.jpg", title:"Oppenheimer", year:"2023", genre:"Històric"},
            {id:6, img:"img/movie6.jpg", title:"L'Home del Nord", year:"2022", genre:"Històric"},
            {id:7, img:"img/movie7.jpg", title:"Dune: Part Two", year:"2024", genre:"Ciència Ficció"},
            {id:8, img:"img/movie8.jpg", title:"Top Gun Maverick", year:"2022", genre:"Acció"},
            {id:9, img:"img/movie9.jpg", title:"La raó d'estar amb tu", year:"2017", genre:"Fantasia"},
            {id:10, img:"img/movie10.jpg", title:"La Balena", year:"2022", genre:"Drama"},
            {id:11, img:"img/movie11.jpg", title:"El Padrí", year:"1972", genre:"Drama"},
            {id:12, img:"img/movie12.jpg", title:"Interestellar", year:"2014", genre:"Ciència Ficció"},
            {id:13, img:"img/movie13.jpg", title:"The Matrix", year:"1999", genre:"Thriller"},
            {id:14, img:"img/movie14.jpg", title:"Shutter Island", year:"2010", genre:"Thriller"},
            {id:15, img:"img/movie15.jpg", title:"Club de Lluita", year:"1999", genre:"Drama"},
            {id:16, img:"img/movie16.jpg", title:"Zodiac", year:"2007", genre:"Misteri"},
            {id:17, img:"img/movie17.jpg", title:"Dos Papes", year:"2019", genre:"Drama"},
            {id:18, img:"img/movie18.jpg", title:"Conclave", year:"2024", genre:"Thriller"},
            {id:19, img:"img/movie19.jpg", title:"Wall Street", year:"1987", genre:"Drama"},
            {id:20, img:"img/movie20.jpg", title:"La Gran Aposta", year:"2015", genre:"Drama"}
        ];

        function renderCards(moviesToShow) {
            const container = document.getElementById('movieGrid');
            container.innerHTML = '';
            moviesToShow.forEach(movie => {
                container.innerHTML += `
                    <div class="col">
                        <div class="card h-100">
                            <img src="${movie.img}" class="card-img-top" alt="${movie.title}">
                            <div class="card-body d-flex flex-column">
                                <h5 class="card-title">${movie.title}</h5>
                                <p class="text-muted">${movie.year} | ${movie.genre}</p>
                                <div class="mt-auto">
                                    <a href="detall.html?id=${movie.id}" class="btn btn-detail w-100">Veure Detall</a>
                                </div>
                            </div>
                        </div>
                    </div>
                `;
            });
            document.getElementById('count').textContent = moviesToShow.length;
        }

        function filterMovies() {
            const search = document.getElementById('searchInput').value.toLowerCase().trim();
            const genre = document.getElementById('genreFilter').value;

            let filtered = pelicules.filter(movie => {
                const matchTitle = movie.title.toLowerCase().includes(search);
                const matchGenre = (genre === "Tots" || movie.genre === genre);
                return matchTitle && matchGenre;
            });

            renderCards(filtered);
        }

        // === GESTIÓ DE LA CERCA GLOBAL DES DE ALTRES PÀGINES ===
        window.onload = () => {
            const urlParams = new URLSearchParams(window.location.search);
            const query = urlParams.get('q');

            if (query) {
                document.getElementById('searchInput').value = query;
                filterMovies();
            } else {
                renderCards(pelicules);
            }
        };
    </script>
</body>
</html>
