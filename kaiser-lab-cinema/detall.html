<!DOCTYPE html>
<html lang="ca">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Detall - Kaiser Lab Cinema</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
            :root { 
                --color-primary: #e6b800; 
                --text-light: #f5f5f5;
                --text-soft: #cccccc;
            }
            
            body { 
                background: #0f0f0f; 
                color: var(--text-light); 
            }
            
            .navbar { 
                background: #1a1a1a; 
                border-bottom: 4px solid var(--color-primary); 
            }
            
            .poster { 
                max-height: 1000px; 
                object-fit: cover; 
                border-radius: 12px; 
            }
            
            .info-box { 
                background: #252525;           /* Fons una mica més clar */
                padding: 2rem; 
                border-radius: 12px; 
                border: 1px solid #444;        /* Vora subtil per separar */
                box-shadow: 0 4px 15px rgba(0,0,0,0.5);
            }
            
            h1, h5 { 
                color: var(--color-primary);   /* Groc daurat com al wireframe */
            }
            
            .text-muted { 
                color: var(--text-soft) !important;   /* Gris més visible */
            }
            
            #sinopsi {
                color: #eeeeee;
                line-height: 1.6;
            }
            
            /* Repartiment (les targetes interiors) */
            #repartiment .bg-dark {
                background: #1a1a1a !important;
            }
            #repartiment small {
                color: #bbbbbb !important;
            }
    </style>
</head>
<body>
    
    <!-- NAVBAR AMB BARRA DE CERCA GLOBAL -->
<nav class="navbar navbar-expand-lg navbar-dark fixed-top">
    <div class="container">
        <a class="navbar-brand" href="index.html">Kaiser Lab Cinema</a>
        
        <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
            <span class="navbar-toggler-icon"></span>
        </button>

        <div class="collapse navbar-collapse" id="navbarNav">
            <ul class="navbar-nav me-auto">
                <li class="nav-item"><a class="nav-link" href="index.html">Inici</a></li>
                <li class="nav-item"><a class="nav-link" href="pelicules.html">Pel·lícules</a></li>
                <li class="nav-item"><a class="nav-link" href="perfil.html">Perfil</a></li>
                <li class="nav-item"><a class="nav-link" href="admin.html">Admin</a></li>
            </ul>

            <!-- BARRA DE CERCA (sempre visible) -->
            <form class="d-flex ms-auto" action="pelicules.html" method="get">
                <input type="search" 
                    name="q" 
                    class="form-control me-2" 
                    placeholder="Cerca pel·lícules..." 
                    style="width: 320px;">
                <button class="btn btn-primary" type="submit">
                    <i class="bi bi-search"></i>
                </button>
            </form>
        </div>
    </div>
</nav>

    <div style="height: 80px;"></div>

    <div class="container my-5">
        <div class="row">
            <!-- POSTER -->
            <div class="col-lg-5 mb-4">
                <img id="poster" class="poster img-fluid w-100" alt="Poster">
            </div>

            <!-- INFORMACIÓ -->
            <div class="col-lg-7">
                <div class="info-box">
                    <h1 id="title" class="text-warning"></h1>
                    <p id="yearGenre" class="text-muted fs-5"></p>

                    <h5>Sinopsi</h5>
                    <p id="sinopsi" class="text-light"></p>

                    <div class="d-flex gap-3 my-4">
                        <a id="trailerBtn" href="#" target="_blank" class="btn btn-primary">Veure Tràiler</a>
                        <a href="#" class="btn btn-outline-light">Afegir a Favorits</a>
                    </div>

                    <h5>Repartiment</h5>
                    <div class="row g-3" id="repartiment">
                        <!-- Es omplen amb JS -->
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- JAVASCRIPT EXTERN -->
    <script src="js/detall.js"></script>
</body>
</html>
